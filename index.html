  <title>DyslexiPen | Tecnologia para uma escrita inclusiva</title>
  <meta name="description" content="Conhece a DyslexiPen, um projeto de tecnologia educativa que pretende apoiar pessoas com dislexia na escrita e promover a inclusão escolar.">
  <meta name="keywords" content="DyslexiPen, dislexia, escrita, inclusão escolar, educação, tecnologia educativa">
  <meta name="theme-color" content="#173B68">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      color: #172B45;
      background: #ffffff;
      line-height: 1.7;
    }

    header {
      background: white;
      padding: 16px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 15px #0000000c;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #173B68;
      text-decoration: none;
      white-space: nowrap;
    }

    .logo img {
      height: 44px;
      width: auto;
      object-fit: contain;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      color: #334155;
      font-size: 14px;
      font-weight: bold;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #3285C7;
    }

    .hero {
      background: linear-gradient(135deg, #edf5ff, #ffffff);
      padding: 90px 8%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
      min-height: 550px;
    }

    .hero-content {
      max-width: 590px;
    }

    .tag {
      color: #2877B9;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(36px, 5vw, 54px);
      line-height: 1.15;
      margin: 18px 0;
      color: #173B68;
    }

    .hero p {
      font-size: 18px;
      color: #52657B;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }

    .btn {
      display: inline-block;
      background: #2169A5;
      color: white;
      padding: 13px 26px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #174C79;
      transform: translateY(-2px);
    }

    .btn-outline {
      display: inline-block;
      background: transparent;
      color: #173B68;
      border: 2px solid #2169A5;
      padding: 11px 22px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      transition: 0.2s;
    }

    .btn-outline:hover {
      background: #edf5ff;
      transform: translateY(-2px);
    }

    .hero-image {
      width: 42%;
      max-width: 490px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(23, 59, 104, 0.12);
      object-fit: cover;
    }

    section {
      padding: 85px 8%;
      scroll-margin-top: 75px;
    }

    .section-title {
      text-align: center;
      font-size: 34px;
      color: #173B68;
      margin-bottom: 15px;
    }

    .section-description {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 45px;
      color: #64748b;
    }

    .bg-light {
      background: #f4f8fd;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 55px;
    }

    .product img {
      width: 42%;
      max-width: 470px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      object-fit: cover;
    }

    .product-text {
      flex: 1;
    }

    .product-text h2 {
      font-size: 32px;
      color: #173B68;
      margin: 10px 0 18px;
    }

    .product-text p {
      margin-bottom: 14px;
      color: #334155;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .stat-highlight {
      font-size: 26px;
      font-weight: bold;
      color: #173B68;
      margin-bottom: 10px;
    }

    .card {
      background: white;
      border: 1px solid #e4ebf3;
      border-radius: 15px;
      padding: 28px;
      box-shadow: 0 5px 20px #173b680a;
    }
